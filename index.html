<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kasir Kita</title>
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
      background-color: #f4f4f4;
    }
    h1 {
      margin-bottom: 20px;
      font-size: 3rem;
      color: #333;
    }
    h1 span {
      color: #ff6600;
    }

    label {
      background-color: #ff6600;
      padding: 15px 20px;
      color: white;
      border-radius: 12px;
      border: 2px solid black;
    }

    select,
    input,
    button {
      margin: 10px;
      font-size: 1rem;
      padding: 12px;
      border: 2px solid;
      border-radius: 20px;
      box-shadow: 2px 5px;
      cursor: pointer;
    }

    #barang {
      background-color: #fff;
      padding: 10px;
      font-size: 1rem;
    }
    .wrapper-total {
      padding: 20px;
      width: 300px;
      margin: 0 auto;
      border-radius: 5px;
      margin-top: 20px;
      font-size: 1.5rem;
      color: #333;
    }
    #gambar-barang {
      display: none;
      width: 200px;
      height: 200px;
    }
  </style>
  <body>
    <h1>SELAMAT DATANG DI <span>KASIR KITA</span></h1>
    <label for="barang">Pilih Barang Anda : </label>
    <select id="barang">
      <option value="Bakso">
        <img src="./images/bakso.webp" alt="Bakso" /> Bakso (Rp. 12.000)
      </option>
      <option value="aqua">Aqua (Rp. 3.000)</option>
      <option value="indomie">Indomie (Rp. 2.000)</option>
      <option value="nasi-goreng">nasi Goreng (Rp. 10.000)</option>
    </select>
    <input type="number" id="jumlah" placeholder="Masukkan jumlah barang" />
    <button onclick="hitungTotal()">Hitung Total</button>
    <div class="wrapper-total">
      <img src="" id="gambar-barang" width="200" />
      <p id="total"></p>
    </div>
    <script>
      function gambar() {
        const barang = document.getElementById("barang").value;
        let gambarSrc = "";

        switch (barang) {
          case "Bakso":
            gambarSrc = "./images/bakso.webp";
            break;
          case "aqua":
            gambarSrc = "./images/aqua.webp";
            break;
          case "indomie":
            gambarSrc = "./images/indomie.webp";
            break;
          case "nasi-goreng":
            gambarSrc = "./images/nasi-goreng.webp";
            break;
        }

        return gambarSrc;
      }

      function hitungTotal() {
        const barang = document.getElementById("barang").value;
        const jumlah = document.getElementById("jumlah").value;
        const gambarSrc = document.getElementById("gambar-barang");
        let harga = 0;

        if (jumlah !== "" && jumlah !== "0") {
          gambarSrc.src = gambar();
          gambarSrc.style.display = "inline";
          switch (barang) {
            case "Bakso":
              harga = 12000;
              break;
            case "aqua":
              harga = 3000;
              break;
            case "indomie":
              harga = 2000;
              break;
            case "nasi-goreng":
              harga = 10000;
              break;
          }
        } else {
          alert("Tolong masukan jumlah barang yang sesuai");
          return;
        }

        const total = harga * jumlah;
        document.getElementById("total").innerText =
          "Total: Rp. " + total.toLocaleString();
      }
    </script>
  </body>
</html>
